services:
  banco:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-chamados}
      POSTGRES_USER: ${DB_USER:-chamados}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chamados_local}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://banco:5432/${DB_NAME:-chamados}
      DB_USER: ${DB_USER:-chamados}
      DB_PASSWORD: ${DB_PASSWORD:-chamados_local}
    depends_on:
      banco:
        condition: service_healthy

volumes:
  dados_postgres:
