name: Verificar API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir e iniciar
        run: docker compose up -d --build
      - name: Conferir API e dados iniciais
        run: |
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/setores > setores.json
          jq -e '.totalElements == 2' setores.json
          curl --fail http://localhost:8080/categorias | jq -e '.totalElements == 4'
          curl --fail http://localhost:8080/usuarios | jq -e '.totalElements == 4'
      - name: Mostrar logs e encerrar
        if: always()
        run: |
          docker compose logs
          docker compose down
